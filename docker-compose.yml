services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillsync
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsync}
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsync -d skillsync"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://skillsync:skillsync@postgres:5432/skillsync}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: skillsync
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env before starting}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      HF_HOME: /home/app/.cache/huggingface
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - modelcache:/home/app/.cache
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://skillsync:skillsync@postgres:5432/skillsync}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: skillsync
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      HF_HOME: /home/app/.cache/huggingface
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "app.bootstrap", "--if-missing"]
    volumes:
      - modelcache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
  mongodata:
  modelcache:
